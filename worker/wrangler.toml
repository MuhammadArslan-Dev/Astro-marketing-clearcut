name = "clearcut-go-router"
main = "src/index.ts"
compatibility_date = "2026-08-11"

# Two patterns needed — "/go/*" alone does not match the bare "/go" path
# (no trailing segment).
routes = [
	{ pattern = "clearcutoff.in/go", zone_name = "clearcutoff.in" },
	{ pattern = "clearcutoff.in/go/*", zone_name = "clearcutoff.in" },
]

[vars]
# Replace with the real Cloudflare Pages deployment URL once that project is
# created (see "Set up Cloudflare Pages project" in PROJECT_PLAN.md).
PAGES_ORIGIN = "https://cc-marketing.pages.dev"
