name = "clearcut-go-router"
main = "src/index.ts"
compatibility_date = "2026-08-11"

# Two patterns needed — "/go/*" alone does not match the bare "/go" path
# (no trailing segment).
routes = [
	{ pattern = "clearcutoff.in/go", zone_name = "clearcutoff.in" },
	{ pattern = "clearcutoff.in/go/*", zone_name = "clearcutoff.in" },
]

[vars]
PAGES_ORIGIN = "https://astro-marketing-clearcut.pages.dev"
